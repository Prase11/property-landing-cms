services:
  - type: web
    name: property-landing-cms
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: cms-data
      mountPath: /var/data
      sizeGB: 1
